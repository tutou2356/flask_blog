<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}{% endblock %} - Huihui 的家</title>
    <script src="https://cdn.tailwindcss.com?plugins=typography"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    
    <!-- 添加 Pygments 代码高亮样式 -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/github.min.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/highlight.min.js"></script>

    <style>
        /* 代码块样式 - 浅色模式 */
        .highlight,
        .highlight pre,
        .highlight code,
        div.highlight,
        div.highlight pre,
        div.highlight code {
            background-color: #f8f9fa !important;
            color: #24292e !important;
        }
        
        .highlight {
            border: 1px solid #e1e4e8 !important;
            border-radius: 8px !important;
            padding: 16px !important;
            margin: 16px 0 !important;
            overflow-x: auto !important;
            font-family: 'Consolas', 'Monaco', 'Courier New', monospace !important;
        }
        
        /* Pygments 语法高亮颜色 */
        .highlight .k { color: #d73a49; } /* 关键字 */
        .highlight .s { color: #032f62; } /* 字符串 */
        .highlight .c { color: #6a737d; } /* 注释 */
        .highlight .n { color: #24292e; } /* 名称 */
        .highlight .o { color: #d73a49; } /* 操作符 */
        .highlight .p { color: #24292e; } /* 标点 */
        .highlight .nb { color: #005cc5; } /* 内置函数 */
        .highlight .nf { color: #6f42c1; } /* 函数名 */
        .highlight .mi { color: #005cc5; } /* 数字 */
        
        /* 深色模式样式 */
        .dark {
            color-scheme: dark;
        }
        
        .dark body {
            background-color: #0f172a !important;
        }
        
        .dark .bg-white {
            background-color: #1e293b !important;
            color: #f1f5f9 !important;
        }
        
        .dark .text-slate-800 {
            color: #f1f5f9 !important;
        }
        
        .dark .text-slate-600 {
            color: #cbd5e1 !important;
        }
        
        .dark .text-slate-500 {
            color: #94a3b8 !important;
        }
        
        .dark .text-slate-700 {
            color: #e2e8f0 !important;
        }
        
        .dark .border-slate-200 {
            border-color: #475569 !important;
        }
        
        .dark .border-slate-300 {
            border-color: #475569 !important;
        }
        
        .dark .bg-slate-100 {
            background-color: #334155 !important;
            color: #e2e8f0 !important;
        }
        
        .dark .bg-slate-50 {
            background-color: #374151 !important;
        }
        
        .dark .hover\:bg-slate-50:hover {
            background-color: #374151 !important;
        }
        
        .dark .hover\:bg-slate-100:hover {
            background-color: #374151 !important;
        }
        
        /* 深色模式下的导航栏 */
        .dark nav {
            background-color: rgba(30, 41, 59, 0.8) !important;
        }
        
        /* 深色模式下的代码块 */
        .dark .highlight {
            background-color: #1e293b !important;
            border-color: #475569 !important;
            color: #e2e8f0 !important;
        }
        
        .dark .highlight .k { color: #ff7b72; } /* 关键字 */
        .dark .highlight .s { color: #a5d6ff; } /* 字符串 */
        .dark .highlight .c { color: #8b949e; } /* 注释 */
        .dark .highlight .n { color: #e2e8f0; } /* 名称 */
        .dark .highlight .o { color: #ff7b72; } /* 操作符 */
        .dark .highlight .p { color: #e2e8f0; } /* 标点 */
        .dark .highlight .nb { color: #79c0ff; } /* 内置函数 */
        .dark .highlight .nf { color: #d2a8ff; } /* 函数名 */
        .dark .highlight .mi { color: #79c0ff; } /* 数字 */
        
        /* 深色模式下的表单元素 */
        .dark input,
        .dark textarea,
        .dark select {
            background-color: #374151 !important;
            border-color: #6b7280 !important;
            color: #f9fafb !important;
        }
        
        .dark input:focus,
        .dark textarea:focus,
        .dark select:focus {
            border-color: #6366f1 !important;
            ring-color: #6366f1 !important;
        }
    </style>
</head>
<body class="bg-slate-100">
    <nav class="bg-white/80 backdrop-blur-md shadow-sm sticky top-0 z-10">
        <div class="max-w-6xl mx-auto px-4">
            <div class="flex justify-between items-center h-16">
                <a href="{{ url_for('index') }}" class="text-2xl font-bold text-indigo-600">Huihui 的家</a>
                
                <!-- 搜索框 -->
                <div class="hidden md:flex flex-1 max-w-md mx-8">
                    <form action="{{ url_for('search') }}" method="get" class="w-full">
                        <div class="relative">
                            <input type="text" name="q" placeholder="搜索文章..." 
                                   class="w-full pl-10 pr-4 py-2 border border-slate-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:border-transparent text-sm"
                                   value="{{ request.args.get('q', '') }}">
                            <i data-lucide="search" class="absolute left-3 top-2.5 w-4 h-4 text-slate-400"></i>
                        </div>
                    </form>
                </div>
                
                <div class="flex items-center gap-4">
                    <!-- 深色模式切换按钮 -->
                    <button id="theme-toggle" class="p-2 rounded-lg hover:bg-slate-100 transition">
                        <i data-lucide="moon" class="w-5 h-5 text-slate-600"></i>
                    </button>
                    
                    <a href="{{ url_for('create') }}" class="bg-indigo-600 text-white px-4 py-2 rounded-md hover:bg-indigo-700 transition text-sm font-medium">
                        <i data-lucide="edit-3" class="inline-block w-4 h-4 mr-1"></i>
                        撰写新文章
                    </a>
                </div>
            </div>
        </div>
    </nav>

    <!-- 检查是否有 content block，如果有就使用单列布局 -->
    {% if self.content() %}
    <div class="max-w-4xl mx-auto mt-8 px-4">
        {% block content %}{% endblock %}
    </div>
    {% else %}
    <!-- 否则使用双列布局 -->
    <div class="max-w-6xl mx-auto mt-8 px-4 grid grid-cols-1 md:grid-cols-4 gap-8">
        <!-- 左侧边栏 Block -->
        {% block sidebar %}
        <!-- 这个 block 默认是空的 -->
        {% endblock %}

        <!-- 右侧主内容区 Block -->
        {% block main_content %}
        <!-- 这个 block 默认也是空的 -->
        {% endblock %}
    </div>
    {% endif %}

    <script>
        // 深色模式切换功能
        const themeToggle = document.getElementById('theme-toggle');
        const html = document.documentElement;
        
        // 检查本地存储的主题设置
        const currentTheme = localStorage.getItem('theme');
        if (currentTheme === 'dark') {
            html.classList.add('dark');
            themeToggle.innerHTML = '<i data-lucide="sun" class="w-5 h-5 text-slate-600"></i>';
        }
        
        // 切换主题
        themeToggle.addEventListener('click', () => {
            html.classList.toggle('dark');
            
            if (html.classList.contains('dark')) {
                localStorage.setItem('theme', 'dark');
                themeToggle.innerHTML = '<i data-lucide="sun" class="w-5 h-5 text-slate-600"></i>';
            } else {
                localStorage.setItem('theme', 'light');
                themeToggle.innerHTML = '<i data-lucide="moon" class="w-5 h-5 text-slate-600"></i>';
            }
            
            // 重新初始化图标
            lucide.createIcons();
        });
        
        // 初始化代码高亮
        document.addEventListener('DOMContentLoaded', function() {
            // 如果使用 highlight.js
            if (typeof hljs !== 'undefined') {
                hljs.highlightAll();
            }
            
            // 初始化图标
            lucide.createIcons();
        });
    </script>
</body>
</html>
