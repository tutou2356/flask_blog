<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}{% endblock %} - 我的技术博客</title>
    <script src="https://cdn.tailwindcss.com?plugins=typography"></script>
    <script src="https://unpkg.com/lucide@latest"></script>

    <!-- ❗️❗️❗️ 关键修复：这里是Pygments需要的CSS样式，不是highlight.js -->
    <style>
        /* Pygments 'default' theme CSS */
        .highlight .hll { background-color: #ffffcc }
        .highlight { background: #f0f0f0; border-radius: 0.5rem; padding: 1em; overflow-x: auto;}
        .highlight .c { color: #888888; } /* Comment */
        .highlight .err { color: #a61717; background-color: #e3d2d2; } /* Error */
        .highlight .k { color: #008800; font-weight: bold; } /* Keyword */
        .highlight .o { color: #333333; } /* Operator */
        .highlight .cm { color: #888888; } /* Comment.Multiline */
        .highlight .cp { color: #cc0000; font-weight: bold; } /* Comment.Preproc */
        .highlight .c1 { color: #888888; } /* Comment.Single */
        .highlight .cs { color: #cc0000; font-weight: bold; } /* Comment.Special */
        .highlight .gd { color: #000000; background-color: #ffdddd; } /* Generic.Deleted */
        .highlight .ge { font-style: italic; } /* Generic.Emph */
        .highlight .gr { color: #aa0000; } /* Generic.Error */
        .highlight .gh { color: #333333; } /* Generic.Heading */
        .highlight .gi { color: #000000; background-color: #ddffdd; } /* Generic.Inserted */
        .highlight .go { color: #888888; } /* Generic.Output */
        .highlight .gp { color: #555555; } /* Generic.Prompt */
        .highlight .gs { font-weight: bold; } /* Generic.Strong */
        .highlight .gu { color: #666666; } /* Generic.Subheading */
        .highlight .gt { color: #aa0000; } /* Generic.Traceback */
        .highlight .kc { color: #008800; font-weight: bold; } /* Keyword.Constant */
        .highlight .kd { color: #008800; font-weight: bold; } /* Keyword.Declaration */
        .highlight .kn { color: #008800; font-weight: bold; } /* Keyword.Namespace */
        .highlight .kp { color: #008800; font-weight: bold; } /* Keyword.Pseudo */
        .highlight .kr { color: #008800; font-weight: bold; } /* Keyword.Reserved */
        .highlight .kt { color: #880088; font-weight: bold; } /* Keyword.Type */
        .highlight .m { color: #0000DD; font-weight: bold; } /* Literal.Number */
        .highlight .s { color: #dd2200; } /* Literal.String */
        .highlight .na { color: #336699; } /* Name.Attribute */
        .highlight .nb { color: #008800; } /* Name.Builtin */
        .highlight .nc { color: #00a000; text-decoration: underline; } /* Name.Class */
        .highlight .no { color: #000000; } /* Name.Constant */
        .highlight .nd { color: #555555; } /* Name.Decorator */
        .highlight .ni { color: #333333; } /* Name.Entity */
        .highlight .ne { color: #cc0000; font-weight: bold; } /* Name.Exception */
        .highlight .nf { color: #00a000; } /* Name.Function */
        .highlight .nl { color: #333333; } /* Name.Label */
        .highlight .nn { color: #00a000; text-decoration: underline; } /* Name.Namespace */
        .highlight .nt { color: #007700; } /* Name.Tag */
        .highlight .nv { color: #003366; } /* Name.Variable */
        .highlight .ow { color: #008800; font-weight: bold; } /* Operator.Word */
        .highlight .w { color: #bbbbbb; } /* Text.Whitespace */
        .highlight .il { color: #0000DD; font-weight: bold; } /* Literal.Number.Integer.Long */
    </style>
</head>
<body class="bg-slate-100">
    <nav class="bg-white/80 backdrop-blur-md shadow-sm sticky top-0 z-10">
        <div class="max-w-6xl mx-auto px-4">
            <div class="flex justify-between items-center h-16">
                <a href="{{ url_for('index') }}" class="text-2xl font-bold text-indigo-600">我的博客</a>
                <a href="{{ url_for('create') }}" class="bg-indigo-600 text-white px-4 py-2 rounded-md hover:bg-indigo-700 transition text-sm font-medium">
                    <i data-lucide="edit-3" class="inline-block w-4 h-4 mr-1"></i>
                    撰写新文章
                </a>
            </div>
        </div>
    </nav>

    <div class="max-w-6xl mx-auto mt-8 px-4 grid grid-cols-1 md:grid-cols-4 gap-8">
        <!-- 左侧边栏 Block -->
        {% block sidebar %}
        <!-- 这个 block 默认是空的 -->
        {% endblock %}

        <!-- 右侧主内容区 Block -->
        {% block main_content %}
        <!-- 这个 block 默认也是空的 -->
        {% endblock %}
    </div>

    <!-- ❗️❗️❗️ 关键：移除了所有 highlight.js 的脚本 -->
    <script>
        lucide.createIcons();
    </script>
</body>
</html>
