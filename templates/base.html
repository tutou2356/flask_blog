<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}{% endblock %} - 我的技术博客</title>
    <script src="https://cdn.tailwindcss.com?plugins=typography"></script>
    
    <!-- Pygments代码高亮样式 - 修复版本 -->
    <style>
        /* 重要：提高CSS优先级，覆盖Tailwind prose样式 */
        .prose .highlight,
        .highlight { 
            background: #f8f8f8 !important; 
            border-radius: 6px !important; 
            padding: 1rem !important; 
            margin: 1rem 0 !important; 
            overflow-x: auto !important;
            border: 1px solid #e1e5e9 !important;
        }
        
        .prose .highlight pre,
        .highlight pre { 
            margin: 0 !important; 
            background: transparent !important;
            font-family: 'Consolas', 'Monaco', 'Courier New', monospace !important;
            font-size: 14px !important;
            line-height: 1.4 !important;
            color: #24292e !important;
        }
        
        .prose .highlight code,
        .highlight code {
            background: transparent !important;
            padding: 0 !important;
            border-radius: 0 !important;
            font-size: inherit !important;
        }
        
        /* Pygments语法高亮样式 - 使用!important确保优先级 */
        .prose .highlight .k, .highlight .k { color: #d73a49 !important; font-weight: bold !important; } /* Keyword */
        .prose .highlight .nf, .highlight .nf { color: #6f42c1 !important; font-weight: bold !important; } /* Function */
        .prose .highlight .nb, .highlight .nb { color: #005cc5 !important; } /* Builtin */
        .prose .highlight .s2, .highlight .s2 { color: #032f62 !important; } /* String */
        .prose .highlight .s1, .highlight .s1 { color: #032f62 !important; } /* String */
        .prose .highlight .s, .highlight .s { color: #032f62 !important; } /* String */
        .prose .highlight .c, .highlight .c { color: #6a737d !important; font-style: italic !important; } /* Comment */
        .prose .highlight .c1, .highlight .c1 { color: #6a737d !important; font-style: italic !important; } /* Comment */
        .prose .highlight .cm, .highlight .cm { color: #6a737d !important; font-style: italic !important; } /* Comment */
        .prose .highlight .p, .highlight .p { color: #24292e !important; } /* Punctuation */
        .prose .highlight .o, .highlight .o { color: #d73a49 !important; } /* Operator */
        .prose .highlight .m, .highlight .m { color: #005cc5 !important; } /* Number */
        .prose .highlight .mi, .highlight .mi { color: #005cc5 !important; } /* Number */
        .prose .highlight .mf, .highlight .mf { color: #005cc5 !important; } /* Number */
        .prose .highlight .nc, .highlight .nc { color: #6f42c1 !important; font-weight: bold !important; } /* Class */
        .prose .highlight .nd, .highlight .nd { color: #6f42c1 !important; font-weight: bold !important; } /* Decorator */
        .prose .highlight .kd, .highlight .kd { color: #d73a49 !important; font-weight: bold !important; } /* Keyword */
        .prose .highlight .kn, .highlight .kn { color: #d73a49 !important; font-weight: bold !important; } /* Keyword */
        .prose .highlight .kt, .highlight .kt { color: #d73a49 !important; } /* Keyword */
        .prose .highlight .nt, .highlight .nt { color: #22863a !important; } /* Tag */
        .prose .highlight .na, .highlight .na { color: #6f42c1 !important; } /* Attribute */
        .prose .highlight .nv, .highlight .nv { color: #e36209 !important; } /* Variable */
    </style>
</head>
<body class="bg-slate-50">
    <nav class="bg-white shadow-md">
        <div class="max-w-4xl mx-auto px-4 py-3 flex justify-between items-center">
            <a href="{{ url_for('index') }}" class="text-2xl font-bold text-indigo-600">我的博客</a>
            <a href="{{ url_for('create') }}" class="bg-indigo-600 text-white px-4 py-2 rounded-md hover:bg-indigo-700 transition">撰写新文章</a>
        </div>
    </nav>
    <main class="max-w-4xl mx-auto p-4 mt-6">
        {% block content %}{% endblock %}
    </main>
</body>
</html>
