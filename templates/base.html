<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}{% endblock %} - Huihui 的家</title>
    <script src="https://cdn.tailwindcss.com?plugins=typography"></script>
    <script src="https://unpkg.com/lucide@latest"></script>

    <style>
        /* 彻底重写代码块样式 - 最高优先级 */
        .highlight,
        .highlight pre,
        .highlight code,
        div.highlight,
        div.highlight pre,
        div.highlight code {
            background-color: #ffffff !important;
            background: #ffffff !important;
            color: #24292e !important;
        }
        
        .highlight {
            border: 1px solid #e1e4e8 !important;
            border-radius: 8px !important;
            padding: 16px !important;
            margin: 16px 0 !important;
            overflow-x: auto !important;
            font-family: 'Consolas', 'Monaco', 'Courier New', monospace !important;
        }
        
        /* 强制覆盖所有可能的深色背景 */
        .highlight * {
            background: transparent !important;
        }
        
        /* 简化的语法高亮 - 确保可见性 */
        .highlight .c,
        .highlight .c1,
        .highlight .cm { color: #6a737d !important; font-style: italic !important; } /* 注释 */
        .highlight .k,
        .highlight .kd,
        .highlight .kn { color: #d73a49 !important; font-weight: bold !important; } /* 关键字 */
        .highlight .s,
        .highlight .s1,
        .highlight .s2 { color: #032f62 !important; } /* 字符串 */
        .highlight .nf { color: #6f42c1 !important; font-weight: bold !important; } /* 函数名 */
        .highlight .nb { color: #005cc5 !important; } /* 内置函数 */
        .highlight .m,
        .highlight .mi { color: #005cc5 !important; } /* 数字 */
        
        /* 确保没有任何元素有深色背景 */
        pre, code {
            background: #ffffff !important;
            color: #24292e !important;
        }
    </style>
</head>
<body class="bg-slate-100">
    <nav class="bg-white/80 backdrop-blur-md shadow-sm sticky top-0 z-10">
        <div class="max-w-6xl mx-auto px-4">
            <div class="flex justify-between items-center h-16">
                <a href="{{ url_for('index') }}" class="text-2xl font-bold text-indigo-600">Huihui 的家</a>
                <a href="{{ url_for('create') }}" class="bg-indigo-600 text-white px-4 py-2 rounded-md hover:bg-indigo-700 transition text-sm font-medium">
                    <i data-lucide="edit-3" class="inline-block w-4 h-4 mr-1"></i>
                    撰写新文章
                </a>
            </div>
        </div>
    </nav>

    <!-- 检查是否有 content block，如果有就使用单列布局 -->
    {% if self.content() %}
    <div class="max-w-4xl mx-auto mt-8 px-4">
        {% block content %}{% endblock %}
    </div>
    {% else %}
    <!-- 否则使用双列布局 -->
    <div class="max-w-6xl mx-auto mt-8 px-4 grid grid-cols-1 md:grid-cols-4 gap-8">
        <!-- 左侧边栏 Block -->
        {% block sidebar %}
        <!-- 这个 block 默认是空的 -->
        {% endblock %}

        <!-- 右侧主内容区 Block -->
        {% block main_content %}
        <!-- 这个 block 默认也是空的 -->
        {% endblock %}
    </div>
    {% endif %}

    <script>
        lucide.createIcons();
    </script>
</body>
</html>
