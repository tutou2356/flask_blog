{% extends 'base.html' %}

{% block title %}撰写新文章{% endblock %}

{% block content %}
    <h1 class="text-3xl font-bold mb-6 text-slate-800">撰写新文章</h1>
    <form method="post" class="bg-white p-6 rounded-lg shadow-md space-y-4">
        <div>
            <label for="title" class="block text-sm font-medium text-slate-700">标题</label>
            <input type="text" name="title" id="title" class="mt-1 block w-full px-3 py-2 border border-slate-300 rounded-md shadow-sm focus:outline-none focus:ring-indigo-500 focus:border-indigo-500" required>
        </div>
        <div>
            <label for="content" class="block text-sm font-medium text-slate-700">内容</label>
            <textarea name="content" id="content" rows="10" class="mt-1 block w-full px-3 py-2 border border-slate-300 rounded-md shadow-sm focus:outline-none focus:ring-indigo-500 focus:border-indigo-500" required></textarea>
        </div>
        <div>
            <button type="submit" class="w-full bg-indigo-600 text-white py-2 px-4 rounded-md hover:bg-indigo-700 transition">发布文章</button>
        </div>
    </form>
{% endblock %}
