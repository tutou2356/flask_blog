{% extends 'base.html' %}

{% block title %}首页{% endblock %}

{% block content %}
    <div class="space-y-6">
        {% for post in posts %}
            <article class="bg-white p-6 rounded-lg shadow-md">
                <h2 class="text-2xl font-semibold text-slate-800">{{ post.title }}</h2>
                <div class="prose mt-4 text-slate-600">
                    {{ post.content | safe }}
                </div>
                <div class="mt-4 flex justify-end">
                    <form action="{{ url_for('delete', id=post.id) }}" method="post">
                        <button type="submit" class="text-sm text-red-500 hover:text-red-700" onclick="return confirm('确定要删除这篇文章吗？');">删除</button>
                    </form>
                </div>
            </article>
        {% else %}
            <p class="text-center text-slate-500">还没有文章，快去写第一篇吧！</p>
        {% endfor %}
    </div>
{% endblock %}
