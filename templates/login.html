{% extends 'base.html' %}

{% block title %}用户登录{% endblock %}

{% block content %}
<div class="max-w-md mx-auto">
    <div class="bg-white p-8 rounded-xl shadow-md">
        <div class="text-center mb-6">
            <h1 class="text-2xl font-bold text-slate-800">🔐 用户登录</h1>
            <p class="text-sm text-slate-500 mt-2">登录您的账户</p>
        </div>

        <form method="post" class="space-y-4">
            {% if next %}
                <input type="hidden" name="next" value="{{ next }}">
            {% endif %}
            
            <div>
                <label for="username" class="block text-sm font-medium text-slate-700 mb-2">
                    用户名
                </label>
                <input 
                    type="text" 
                    id="username" 
                    name="username" 
                    required
                    class="w-full px-3 py-2 border border-slate-300 rounded-md focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500"
                    placeholder="请输入用户名"
                    autofocus
                >
            </div>
            
            <div>
                <label for="password" class="block text-sm font-medium text-slate-700 mb-2">
                    密码
                </label>
                <input 
                    type="password" 
                    id="password" 
                    name="password" 
                    required
                    class="w-full px-3 py-2 border border-slate-300 rounded-md focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500"
                    placeholder="请输入密码"
                >
            </div>
            
            <button 
                type="submit" 
                class="w-full bg-indigo-600 text-white py-2 px-4 rounded-md hover:bg-indigo-700 focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:ring-offset-2 transition font-medium"
            >
                🔓 登录
            </button>
        </form>
        
        <div class="mt-6 text-center space-y-2">
            <p class="text-sm text-slate-600">
                还没有账户？ 
                <a href="{{ url_for('register') }}" class="text-indigo-600 hover:text-indigo-800 font-medium">
                    立即注册
                </a>
            </p>
            <a href="{{ url_for('index') }}" class="block text-sm text-slate-500 hover:text-slate-700">
                ← 返回首页
            </a>
        </div>
    </div>
</div>

<script>
    lucide.createIcons();
</script>
{% endblock %}
